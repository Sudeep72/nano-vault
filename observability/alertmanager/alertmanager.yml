global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match: {severity: critical}
      receiver: pager
      repeat_interval: 15m
    - match: {severity: warning}
      receiver: slack

receivers:
  - name: default
    webhook_configs:
      - url: 'http://nanovault-api:8000/api/v3/alerts/webhook'

  - name: pager
    webhook_configs:
      - url: 'http://nanovault-api:8000/api/v3/alerts/webhook'
        send_resolved: true

  - name: slack
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE/WITH/REAL_WEBHOOK'
        channel: '#nanovault-alerts'
        send_resolved: true
