apiVersion: apps/v1
kind: Deployment
metadata: {name: nanovault-admission-webhook, namespace: nanovault}
spec:
  replicas: 1
  selector: {matchLabels: {app: nanovault-admission-webhook}}
  template:
    metadata: {labels: {app: nanovault-admission-webhook}}
    spec:
      containers:
        - name: webhook
          image: nanovault-admission-webhook:3.0.0
          ports: [{containerPort: 8443}]
          readinessProbe: {httpGet: {path: /healthz, port: 8443}}
---
apiVersion: v1
kind: Service
metadata: {name: nanovault-admission-webhook, namespace: nanovault}
spec:
  selector: {app: nanovault-admission-webhook}
  ports: [{port: 443, targetPort: 8443}]
