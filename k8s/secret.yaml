apiVersion: v1
kind: Secret
metadata:
  name: nanovault-secrets
  namespace: nanovault
type: Opaque
stringData:
  SECRET_KEY: "replace-with-generated-secret-key"
  JWT_SECRET_KEY: "replace-with-generated-jwt-key"
  ENCRYPTION_KEY: "replace-with-generated-encryption-key-base64"
  DATABASE_URL: "postgresql+asyncpg://nano_vault_user:nano_vault_pass@nanovault-postgres:5432/nano_vault_db"
