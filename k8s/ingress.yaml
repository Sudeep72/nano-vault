apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nanovault-ingress
  namespace: nanovault
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - {hosts: [nanovault.example.com], secretName: nanovault-tls}
  rules:
  - host: nanovault.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: nanovault-api, port: {number: 8000}}
