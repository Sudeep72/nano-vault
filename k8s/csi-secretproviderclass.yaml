# CSI Driver Simulation — mirrors HashiCorp Vault's Secrets Store CSI Driver pattern.
# In production this would be backed by the secrets-store-csi-driver + a NanoVault CSI provider.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nanovault-secrets-provider
  namespace: nanovault
spec:
  provider: nanovault
  parameters:
    vaultAddress: "https://nanovault-api:8000"
    roleName: "nanovault-api"
    objects: |
      - objectName: "db-password"
        secretPath: "database/prod/password"
      - objectName: "api-key"
        secretPath: "aws/prod/access_key"
